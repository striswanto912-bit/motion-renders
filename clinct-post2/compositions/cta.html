<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CTA pill — comment BLUE or BROWN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #cta { position: relative; width: 1080px; height: 1920px; font-family: 'Poppins', sans-serif; }
  #cta-pill {
    position: absolute; left: 0; top: 700px; width: 100%;
    display: flex; justify-content: center; pointer-events: none;
  }
  #cta-inner {
    background: #ffffff; border: 5px solid #1A1A1A; border-radius: 999px;
    padding: 18px 40px 20px; font-weight: 800; text-align: center;
    color: #1A1A1A; white-space: nowrap;
    box-shadow: 0 10px 0 rgba(26, 26, 26, 0.9);
  }
  #cta-inner .cta-line1 { font-size: 36px; line-height: 1.1; }
  #cta-inner .cta-line2 { font-size: 48px; line-height: 1.05; }
  #cta-inner .w-blue { color: #2B6CF5; }
  #cta-inner .w-brown { color: #8A5A2B; }
</style>
</head>
<body>
<div id="cta" data-composition-id="cta" data-start="42.6" data-duration="7.0">
  <div id="cta-pill">
    <div id="cta-inner">
      <div class="cta-line1">comment</div>
      <div class="cta-line2"><span class="w-blue">BLUE</span> or <span class="w-brown">BROWN</span></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  tl.fromTo("#cta-inner",
    { opacity: 0, scale: 0.85 },
    { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 0);
  tl.to("#cta-inner", { scale: 1.06, duration: 0.15, ease: "power2.out" }, 3.64);
  tl.to("#cta-inner", { scale: 1, duration: 0.2, ease: "power2.inOut" }, 3.79);
  window.__timelines = window.__timelines || {};
  window.__timelines["cta"] = tl;
})();
</script>
</body>
</html>
